<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Chat UI</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  color-scheme: light;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
}
html, body { min-height: 100%; }
body {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f3f4f8;
  color: #14192c;
}
.app {
  display: flex;
  margin-top: 90px;
  flex-direction: column;
  width: min(460px, calc(100vw - 32px));
  height: 920px;
  background: #ffffff;
  border: 1px solid #e6e9f1;
  border-radius: 34px;
  overflow: hidden;
  box-shadow: 0 32px 80px rgba(20, 25, 40, 0.12);
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 18px 14px;
  border-bottom: 1px solid #e6e9f1;
  background: #ffffff;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-icon {
  width: 34px;
  height: 34px;
  background: #ffe7dc;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #e25932;
  font-size: 15px;
}
.brand-name {
  font-size: 15px;
  font-weight: 700;
  color: #14192c;
}
.speed-pills {
  display: flex;
  gap: 6px;
}
.speed-pill {
  font-size: 11px;
  padding: 8px 12px;
  border-radius: 18px;
  border: 1px solid #dde3ec;
  color: #566176;
  background: #f7f8fb;
  cursor: pointer;
}
.speed-pill.active {
  background: #fff2ec;
  color: #d25a34;
  border-color: #f3d3c7;
}
.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #f6f7fb;
  border: 1px solid #d8dce6;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #55607b;
  font-size: 13px;
  position: relative;
}
.avatar::after {
  content: '';
  position: absolute;
  bottom: 1px;
  right: 1px;
  width: 8px;
  height: 8px;
  background: #42b16a;
  border-radius: 50%;
  border: 2px solid #ffffff;
}
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: #f9fafc;
}
.messages::-webkit-scrollbar {
  width: 6px;
}
.messages::-webkit-scrollbar-track {
  background: transparent;
}
.messages::-webkit-scrollbar-thumb {
  background: rgba(84, 95, 126, 0.18);
  border-radius: 999px;
}
.msg-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.msg-row.user {
  flex-direction: row-reverse;
}
.bot-icon,
.user-icon {
  width: 34px;
  height: 34px;
  min-width: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  margin-top: 2px;
}
.bot-icon {
  background: #ffe7dc;
  color: #e25932;
}
.user-icon {
  background: #e7f2ff;
  color: #1c2538;
}
.bubble {
  max-width: 78%;
  padding: 14px 16px;
  border-radius: 20px;
  font-size: 14px;
  line-height: 1.6;
  box-shadow: 0 10px 24px rgba(82, 94, 147, 0.06);
}
.bubble.bot {
  background: #ffffff;
  color: #191f33;
  border-bottom-left-radius: 6px;
}
.bubble.user {
  background: #ffede6;
  color: #b54f2d;
  border-bottom-right-radius: 6px;
}
.quick-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-left: 44px;
}
.chip {
  font-size: 12px;
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid #e4e8f1;
  color: #5f6d89;
  background: #ffffff;
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  white-space: nowrap;
}
.chip:hover {
  transform: translateY(-1px);
  border-color: #f6d2c5;
  color: #d25a34;
}
.typing-bubble {
  background: #ffffff;
  padding: 14px 16px;
  border-radius: 20px;
  border-bottom-left-radius: 6px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 10px 24px rgba(82, 94, 147, 0.06);
}
.typing-dots {
  display: flex;
  gap: 6px;
}
.typing-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #c3cad8;
  animation: tdot 1.2s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes tdot { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
.typing-label { font-size: 12px; color: #6f7b94; }
.suggestions-bar {
  padding: 16px 18px 12px;
  border-top: 1px solid #e6e9f1;
  background: #fbfbfe;
}
.suggestions-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.suggestions-label {
  font-size: 11px;
  color: #7a86a3;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.suggestion-controls {
  display: flex;
  gap: 8px;
}
.suggestion-controls .slider-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid #e6e9f1;
  background: #ffffff;
  color: #6d7b99;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
}
.suggestion-controls .slider-btn:hover {
  background: #f2f4f9;
  transform: translateY(-1px);
}
.suggestions-wrap {
  position: relative;
}
.suggestions-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
  scroll-behavior: smooth;
}
.suggestions-scroll::-webkit-scrollbar {
  display: none;
}
.sug-card {
  min-width: 128px;
  background: #ffffff;
  border-radius: 18px;
  border: 1px solid #e8ecf4;
  padding: 14px 14px 12px;
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.15s ease;
  flex-shrink: 0;
  box-shadow: 0 18px 40px rgba(68, 84, 130, 0.06);
}
.sug-card:hover {
  transform: translateY(-2px);
  border-color: #f9d7cd;
}
.sug-emoji { font-size: 20px; margin-bottom: 8px; }
.sug-name {
  font-size: 13px;
  font-weight: 600;
  color: #222b42;
  margin-bottom: 3px;
}
.sug-price { font-size: 12px; color: #7a8298; }
.input-area {
  padding: 16px 18px 20px;
  border-top: 1px solid #e6e9f1;
  background: #ffffff;
}
.input-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #f6f7fb;
  border-radius: 999px;
  padding: 10px 16px;
  border: 1px solid #e6e9f1;
  transition: border-color 0.15s ease;
}
.input-row:focus-within { border-color: #f7c2b5; }
#msg-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-size: 14px;
  color: #1c2538;
}
#msg-input::placeholder { color: #9aa2b7; }
.input-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #ffffff;
  border: 1px solid #e6e9f1;
  color: #6d7b99;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
}
.icon-btn svg,
.send-btn svg,
.brand-icon svg,
.avatar svg,
.bot-icon svg,
.user-icon svg {
  width: 18px;
  height: 18px;
}
.icon-btn:hover {
  background: #f2f4f9;
  transform: translateY(-1px);
}
.send-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #ff8d60;
  border: none;
  color: #ffffff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  transition: background 0.15s ease, transform 0.15s ease;
}
.send-btn:hover { background: #e07245; transform: translateY(-1px); }
.send-btn:disabled {
  background: #d5d8e1;
  cursor: not-allowed;
}
.status-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0 0;
  font-size: 11px;
  color: #7a86a3;
}
.receipt {
  background: #fbfbff;
  border: 1px solid #e6e9f1;
  border-radius: 20px;
  padding: 18px;
  font-size: 13px;
  color: #2b3245;
}
.receipt-header {
  text-align: center;
  padding-bottom: 12px;
  border-bottom: 1px dashed #d9dee9;
  margin-bottom: 12px;
}
.receipt-title {
  font-size: 15px;
  font-weight: 700;
  color: #e25932;
  margin-bottom: 4px;
}
.receipt-sub { font-size: 12px; color: #6b748d; }
.receipt-order { font-size: 12px; color: #8c98b1; margin-top: 6px; }
.receipt-items { margin-bottom: 12px; }
.receipt-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid #e7ecf5;
}
.item-name { color: #2b3245; }
.item-qty { color: #7a86a3; margin-left: 4px; }
.item-price { color: #2b3245; font-weight: 600; }
.receipt-divider { border: none; border-top: 1px dashed #d9dee9; margin: 12px 0; }
.receipt-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 12px;
  color: #7a86a3;
}
.receipt-total {
  display: flex;
  justify-content: space-between;
  padding: 8px 0 0;
  font-size: 13px;
  font-weight: 700;
  color: #1c2538;
  border-top: 1px solid #e7ecf5;
  margin-top: 8px;
}
.pickup-badge {
  margin-top: 14px;
  background: #fff3ed;
  border: 1px solid #f4d4c6;
  border-radius: 16px;
  padding: 14px 14px;
  display: flex;
  align-items: start;
  gap: 10px;
}
.pickup-badge i { font-size: 16px; color: #e25932; margin-top: 2px; }
.pickup-text { font-size: 12px; color: #5f6d89; line-height: 1.5; }
.pickup-text strong { color: #1f293d; display: block; font-size: 13px; margin-bottom: 3px; }
</style>

function removeTyping() {
  const t = document.getElementById('typing-row');
  if (t) t.remove();

function parseOrder(text) {
  const lower = text.toLowerCase();
  const qtyMap = { one:1, two:2, three:3, four:4, five:5, a:1, an:1 };
  const found = {};
  for (const [key, item] of Object.entries(MENU)) {
    if (lower.includes(key)) {
      const id = item.name;
      if (!found[id]) {
        let qty = 1;
        const beforeMatch = lower.slice(0, lower.indexOf(key));
        const words = beforeMatch.trim().split(/\s+/);
        const lastWord = words[words.length - 1];
        if (/^\d+$/.test(lastWord)) qty = parseInt(lastWord);
        else if (qtyMap[lastWord]) qty = qtyMap[lastWord];
        found[id] = { ...item, qty };
      }
    }
  }
  return Object.values(found);
}

function genOrderNum() {
  return '#OC-' + Math.floor(10000 + Math.random() * 90000);
}

function pickupTime() {
  const now = new Date();
  now.setMinutes(now.getMinutes() + 15 + Math.floor(Math.random() * 20));
  return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function buildReceipt(items) {
  const sub = items.reduce((s, i) => s + i.price * i.qty, 0);
  const tax = sub * 0.08;
  const total = sub + tax;
  const orderNum = genOrderNum();
  const time = pickupTime();
  const loc = LOCATIONS[Math.floor(Math.random() * LOCATIONS.length)];
  const itemRows = items.map(i =>
    `<div class="receipt-item">
      <span>${i.emoji} <span class="item-name">${i.name}</span><span class="item-qty">x${i.qty}</span></span>
      <span class="item-price">$${(i.price * i.qty).toFixed(2)}</span>
    </div>`
  ).join('');
  return `<div class="receipt">
    <div class="receipt-header">
      <div class="receipt-title">The Restaurant</div>
      <div class="receipt-sub">Order Confirmed</div>
      <div class="receipt-order">${orderNum} &nbsp;·&nbsp; ${new Date().toLocaleDateString()}</div>
    </div>
    <div class="receipt-items">${itemRows}</div>
    <hr class="receipt-divider" />
    <div class="receipt-row"><span>Subtotal</span><span>$${sub.toFixed(2)}</span></div>
    <div class="receipt-row"><span>Tax (8%)</span><span>$${tax.toFixed(2)}</span></div>
    <div class="receipt-total"><span>Total</span><span>$${total.toFixed(2)}</span></div>
    <div class="pickup-badge">
      <i class="ti ti-clock" aria-hidden="true"></i>
      <div class="pickup-text">
        <strong>Ready for pickup at ${time}</strong>
        ${loc}
      </div>
    </div>
  </div>`;
}

async function processOrder(text) {
  isBusy = true;
  document.getElementById('send-btn').disabled = true;
  const typingRow = showTyping();
  const label = document.getElementById('typing-label');

  let step = 0;
  const interval = setInterval(() => {
    step = (step + 1) % STEPS.length;
    if (label) label.textContent = STEPS[step];
  }, 900);

  await new Promise(r => setTimeout(r, 3200));
  clearInterval(interval);
  removeTyping();

  const items = parseOrder(text);
  isBusy = false;
  document.getElementById('send-btn').disabled = false;

  if (items.length === 0) {
    addBotBubble(`Hmm, I couldn't find those items on our menu. Try something like <em>2 burgers and truffle fries</em>, or tap a suggestion above! 🍽️`);
    return;
  }
  addBotBubble(buildReceipt(items));
}

function sendChip(label) {
  if (isBusy) return;
  const lower = label.toLowerCase();
  addUserBubble(label);
  if (lower.includes('special')) {
    setTimeout(() => addBotBubble("Today's specials: 🍔 Wagyu Smash Burger, 🦞 Lobster Bisque, 🥩 Ribeye Steak. Just type what you'd like to order!"), 600);
  } else {
    setTimeout(() => addBotBubble(`I can help with <em>${label}</em>! 1. Burgers, 2. Coffee, 3. Salads & more`), 600);
  }
}

function orderSuggested(name, price) {
  if (isBusy) return;
  document.getElementById('msg-input').value = `1 ${name}`;
  document.getElementById('msg-input').focus();
}

function handleKey(e) {
  if (e.key === 'Enter') handleSend();
}

function handleSend() {
  if (isBusy) return;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addUserBubble(text);
  processOrder(text);
}

function scrollSuggestions(direction) {
  const container = document.getElementById('suggestions-scroll');
  if (!container) return;
  const scrollAmount = container.clientWidth * 0.7;
  container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
}

document.querySelectorAll('.speed-pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.speed-pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
  });
});
